name: tracemigo-local
services:
  postgres:
    image: ${TRACEMIGO_POSTGRES_IMAGE:?Set a pinned postgres image digest in infra/local/.env}
    environment:
      POSTGRES_USER: tracemigo_dev
      POSTGRES_DB: tracemigo_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracemigo_dev -d tracemigo_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: ${TRACEMIGO_REDIS_IMAGE:?Set a pinned redis image digest in infra/local/.env}
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--bind", "0.0.0.0", "--protected-mode", "no", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
secrets:
  postgres_password:
    file: ../../.local/postgres-password
volumes:
  postgres_data:
