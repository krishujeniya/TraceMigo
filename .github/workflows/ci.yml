name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tier1_untrusted_pr:
    name: "Tier 1: Static Verification & Leakage Defense"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: none
      issues: none
      pull-requests: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Setup uv
        uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: .python-version

      - name: Install dependencies (frozen lockfile)
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen

      - name: Verify package boundaries and linting
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Unit & API foundation tests
        run: pnpm test:unit

      - name: Python runtime import and boundary checks
        run: pnpm python:check

      - name: Preview server security & lifecycle check
        run: pnpm preview:check

      - name: Brand assets & design token check
        run: pnpm brand:check

      - name: Workspace build
        run: pnpm build

      - name: Public artifact & secret leakage guard
        run: pnpm security:check

      - name: Synthetic negative leakage canary checks
        run: python3 tools/ci/check-canaries.py

  tier2_trusted_main:
    name: "Tier 2: Trusted Build, Provenance & Supply Chain"
    needs: [tier1_untrusted_pr]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Setup uv
        uses: astral-sh/setup-uv@b5f58b2abc5763ade55e4e9d0fe52cd1ff7979ca # v5.2.1
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: .python-version

      - name: Install dependencies (frozen lockfile)
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen

      - name: Full workspace build
        run: pnpm build

      - name: Artifact guard verification
        run: pnpm security:check

      - name: Run negative canaries
        run: python3 tools/ci/check-canaries.py
