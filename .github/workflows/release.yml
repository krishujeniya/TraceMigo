name: Release & Deployment

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment target environment (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  id-token: write # Required for GitHub Actions OIDC exchange with GCP Workload Identity

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  tier3_release_deploy:
    name: "Tier 3: Authenticated Release Pipeline"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target_env || 'staging' }}
    steps:
      - name: Assert release originates from main branch or release tag
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" && "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "ERROR: Releases and deployments are only permitted from main branch or versioned tags."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version-file: .python-version

      - name: Install dependencies (frozen lockfile)
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen

      - name: Pre-release verification gates
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:unit
          pnpm python:check
          pnpm preview:check
          pnpm brand:check
          pnpm build
          pnpm security:check
          python3 tools/ci/check-canaries.py

      - name: Authenticate to Google Cloud via OIDC Workload Identity
        if: ${{ env.GCP_WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA }}
          token_format: 'access_token'
          access_token_lifetime: '900s' # 15 minutes short-lived token
        env:
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}

      - name: Deployment record confirmation
        run: |
          echo "Release verification passed for ref ${{ github.ref }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "No untrusted learner code executed on deployment host."
